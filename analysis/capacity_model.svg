<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PyMC capacity model hierarchy</title>
  <desc id="desc">A shared intercept, pooled stage and operator effects, acreage effect, and residual scale feed observed and missing project log capacity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:10; }
      .group { fill:#eef2ff; stroke:#6366f1; stroke-width:2; rx:14; }
      .target { fill:#dcfce7; stroke:#166534; stroke-width:2; rx:10; }
      .label { font: 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font-size:14px; }
      .group-label { font: 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-weight:600; fill:#3730a3; }
      .edge { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" fill="white"/>
  <text x="600" y="34" class="label" style="font-size:22px;font-weight:600">Hierarchical log(MW) model</text>

  <rect x="35" y="75" width="270" height="190" class="group"/>
  <text x="55" y="103" class="group-label" text-anchor="start">Stage effects</text>
  <rect x="65" y="125" width="210" height="45" class="box"/>
  <text x="170" y="153" class="label small">stage_z ~ Normal(0, 1)</text>
  <rect x="65" y="185" width="210" height="45" class="box"/>
  <text x="170" y="213" class="label small">stage_sd ~ HalfNormal(1)</text>
  <rect x="65" y="235" width="210" height="20" fill="none" stroke="none"/>
  <text x="170" y="250" class="label small">stage_effect = z × sd</text>

  <rect x="35" y="300" width="270" height="190" class="group"/>
  <text x="55" y="328" class="group-label" text-anchor="start">Operator effects</text>
  <rect x="65" y="350" width="210" height="45" class="box"/>
  <text x="170" y="378" class="label small">operator_z ~ Normal(0, 1)</text>
  <rect x="65" y="410" width="210" height="45" class="box"/>
  <text x="170" y="438" class="label small">operator_sd ~ HalfNormal(1)</text>
  <text x="170" y="478" class="label small">operator_effect = z × sd</text>

  <rect x="360" y="100" width="220" height="55" class="box"/>
  <text x="470" y="133" class="label">intercept ~ Normal(log 300, 2)</text>
  <rect x="360" y="205" width="220" height="55" class="box"/>
  <text x="470" y="238" class="label">area_effect ~ Normal(0.7, 0.7)</text>
  <rect x="360" y="310" width="220" height="55" class="box"/>
  <text x="470" y="343" class="label">sigma ~ HalfNormal(1.5)</text>

  <rect x="700" y="155" width="220" height="80" class="target"/>
  <text x="810" y="187" class="label">observed log(MW)</text>
  <text x="810" y="211" class="label small">reported projects</text>
  <rect x="700" y="335" width="220" height="100" class="target"/>
  <text x="810" y="370" class="label">posterior predictive</text>
  <text x="810" y="394" class="label">missing log(MW)</text>
  <text x="810" y="418" class="label small">clipped to 0.1–10,000 MW</text>

  <path d="M305 175 C430 175 560 190 700 190" class="edge"/>
  <path d="M305 400 C430 400 560 210 700 210" class="edge"/>
  <path d="M580 128 L700 175" class="edge"/>
  <path d="M580 232 L700 195" class="edge"/>
  <path d="M580 337 L700 220" class="edge"/>
  <path d="M580 128 C650 128 650 365 700 365" class="edge"/>
  <path d="M580 232 C640 232 650 385 700 385" class="edge"/>
  <path d="M580 337 C640 337 650 405 700 405" class="edge"/>
  <path d="M920 195 L1040 195" class="edge"/>
  <path d="M920 385 L1040 385" class="edge"/>
  <text x="1090" y="190" class="label small">fit to known</text>
  <text x="1090" y="214" class="label small">capacities</text>
  <text x="1090" y="380" class="label small">used for</text>
  <text x="1090" y="404" class="label small">missing sizes</text>
</svg>
